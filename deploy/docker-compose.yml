# Fitroom on a droplet: the Rails app, and Caddy in front of it for HTTPS (it gets and renews the certificate
# itself). Copy .env.example to .env beside this file and fill in SECRET_KEY_BASE and FITROOM_HOST. See
# docs/droplet.md.
services:
  web:
    build:
      context: ..
      # FITROOM_STUDIO=1 in .env builds Blender in, for studio photos on the CPU (deploy/studio/README.md).
      args:
        STUDIO: ${FITROOM_STUDIO:-0}
    restart: unless-stopped
    env_file: .env
    environment:
      RAILS_ENV: production
      FITROOM_VISION_URL: /vision
    volumes:
      - storage:/rails/storage
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 5

  # The store photos' AI models on the server's CPU (script/server/vision.mjs); the page reaches it at /vision.
  vision:
    build: ../script/server
    restart: unless-stopped
    environment:
      # Optional models, off when empty (docs/droplet.md): what a photo shows, and a clothes parse that keeps
      # skin, hair and backdrop off the cloth.
      DETAILS_MODEL: ${FITROOM_DETAILS_MODEL:-}
      PARSE_MODEL: ${FITROOM_PARSE_MODEL:-}
    volumes:
      - models:/models
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Jobs run by hand or by cron, not kept running (`docker compose --profile tools run --rm ...`; see
  # docs/droplet.md): the drape atlas (script/bank/atlas.mjs) and the nightly accuracy run
  # (script/validation/nightly.mjs), in Playwright's image with its Chromium, on the droplet's CPU.
  tools:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      PLAYWRIGHT_MODULE: /usr/lib/node_modules/playwright
    depends_on:
      - web

volumes:
  storage:
  models:
  caddy_data:
  caddy_config:
